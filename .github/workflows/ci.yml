name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # psycopg2-binary needs system libpq; runtime deps not exercised
          # by the offline test suite, so skip the heavy installs in CI.
          pip install fastapi==0.110.3 'uvicorn[standard]==0.30.0' httpx \
                      python-multipart pyyaml pydantic pytest

      - name: Syntax check
        run: |
          python -m py_compile audit_layer/*.py evaluation/*.py scripts/*.py

      - name: Run tests
        run: pytest tests/ -q
