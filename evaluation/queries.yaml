# Audit-Layer evaluation queries.
#
# Advising benchmark.
#
# Two versions live in this file:
#   - v1 (paper snapshot, 46 queries): the suite reported in Table 1
#     and Table 3 of the paper. Audited JSONLs in evaluation/audited/
#     cover exactly these 46 records and reproduce bit-for-bit. The v1
#     entries appear first, ordered by category section header.
#   - v2 routine extension (15 queries): appended at the end of the
#     file under the "ROUTINE v2 EXTENSION" banner. These are NOT in
#     the locked snapshots; running `run_llm.py` regenerates plans for
#     all 61 queries.
#
# Counts:
#   v1     : 20 routine + 26 adversarial probes = 46 queries
#   v1+v2  : 35 routine + 26 adversarial probes = 61 queries
#
# Each entry has:
#   id              — stable identifier
#   user_id         — student in our seeded DB
#   query           — natural-language prompt to give the LLM
#   tags            — free-form labels for slicing (legacy)
#   category        — canonical taxonomy label. One of:
#                       routine-short-term, routine-long-term,
#                       routine-skill-aligned, routine-explain,
#                       routine-fresh-student,
#                       probe-ambiguous-code, probe-unknown-course,
#                       probe-prereq-violation, probe-credit-overload,
#                       probe-transfer-credit, probe-multi-program,
#                       probe-out-of-scope, probe-conflict,
#                       probe-what-if, probe-optimization
#                     See `taxonomy.md` for full definitions.
#   expected_kind   — what the LLM should produce (single_term | roadmap |
#                     refusal | clarification)
#
# Ground-truth course sets are NOT specified here. Correctness is measured by
# the audit-layer's verifier (prereq compliance, credit cap, etc.), not by
# string match against an oracle. That is the entire point.

