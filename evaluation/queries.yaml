# Audit-Layer evaluation queries.
#
# Adversarial advising benchmark used in the paper. Mix of in-scope
# planning prompts and edge cases (out-of-scope programs, ambiguous
# semesters, transfers, double majors) chosen to surface plan-level
# failure modes that response-similarity metrics miss.
#
# Each entry has:
#   id              — stable identifier
#   user_id         — student in our seeded DB
#   query           — natural-language prompt to give the LLM
#   tags            — for slicing results (short_term, long_term, skill,
#                     out_of_scope, ambiguous, transfer, double_major,
#                     conflict, unknown_course)
#   expected_kind   — what the LLM should produce (single_term | roadmap |
#                     refusal | clarification)
#
# Ground-truth course sets are NOT specified here. Correctness is measured by
# the audit-layer's verifier (prereq compliance, credit cap, etc.), not by
# string match against an oracle. That is the entire point.

queries:
  # ───── in-scope short-term (next-semester recommendations) ─────
  - id: ist_01
    user_id: 4942915      # CS-BS, 4 courses done
    query: "What courses should I take next semester for my CS major?"
    tags: [short_term]
    expected_kind: single_term

  - id: ist_02
    user_id: 4942915
    query: "Suggest 5 courses for Fall 2026 with a 15-credit cap."
    tags: [short_term]
    expected_kind: single_term

  - id: ist_03
    user_id: 4942915
    query: "I want to focus on machine learning — what classes should I take next?"
    tags: [short_term, skill]
    expected_kind: single_term

  - id: ist_04
    user_id: 6564893      # CS-BS-SDD, 3 done
    query: "What should I take in Spring 2027?"
    tags: [short_term]
    expected_kind: single_term

  - id: ist_05
    user_id: 7689039      # MS-CS, 56 done
    query: "Recommend electives I can finish in one semester."
    tags: [short_term]
    expected_kind: single_term

  # ───── in-scope long-term roadmaps ─────
  - id: ilt_01
    user_id: 4942915
    query: "Build me a degree plan to finish my CS BS as quickly as possible."
    tags: [long_term]
    expected_kind: roadmap

  - id: ilt_02
    user_id: 4942915
    query: "Plan the rest of my CS degree starting from Fall 2026."
    tags: [long_term]
    expected_kind: roadmap

  - id: ilt_03
    user_id: 6564893
    query: "Give me a roadmap for the SDD track."
    tags: [long_term]
    expected_kind: roadmap

  - id: ilt_04
    user_id: 4942915
    query: "I want to graduate by Spring 2028. What should I take each semester?"
    tags: [long_term]
    expected_kind: roadmap

  - id: ilt_05
    user_id: 7689039
    query: "Plan my MS-CS thesis-track sequence over the next year."
    tags: [long_term]
    expected_kind: roadmap

  # ───── in-scope skill-aligned ─────
  - id: isk_01
    user_id: 4942915
    query: "I want a career in cybersecurity — what classes align?"
    tags: [skill]
    expected_kind: single_term

  - id: isk_02
    user_id: 4942915
    query: "Recommend courses to prepare for software engineering internships."
    tags: [skill]
    expected_kind: single_term

  - id: isk_03
    user_id: 4942915
    query: "I want to focus on data engineering before graduating."
    tags: [skill, long_term]
    expected_kind: roadmap

  # ───── in-scope check / explain / credits ─────
  - id: iex_01
    user_id: 4942915
    query: "Am I eligible to take COP_3530?"
    tags: [check_prerequisite]
    expected_kind: clarification

  - id: iex_02
    user_id: 4942915
    query: "Why do I need to take MAC_2311 before COP_3337?"
    tags: [explain]
    expected_kind: clarification

  - id: iex_03
    user_id: 4942915
    query: "How many credits is CAP_4630?"
    tags: [credit_info]
    expected_kind: clarification

  # ───── in-scope edge — empty history ─────
  - id: iem_01
    user_id: 4942915
    query: "I'm just starting my CS degree. What should I take first?"
    tags: [short_term, fresh]
    expected_kind: single_term

  - id: iem_02
    user_id: 4942915
    query: "Plan my whole CS degree from semester 1."
    tags: [long_term, fresh]
    expected_kind: roadmap

  - id: iem_03
    user_id: 4942915
    query: "I want to maximize my GPA in my next semester. What's safe?"
    tags: [short_term]
    expected_kind: single_term

  - id: iem_04
    user_id: 4942915
    query: "Give me a 3-course load that's manageable."
    tags: [short_term]
    expected_kind: single_term

  # ───── adversarial: ambiguous course codes ─────
  - id: adv_amb_01
    user_id: 4942915
    query: "Is cap-4630 something I can take next semester?"
    tags: [adversarial, ambiguous]
    expected_kind: clarification

  - id: adv_amb_02
    user_id: 4942915
    query: "What courses align with COP3530 and MAD 2104?"
    tags: [adversarial, ambiguous]
    expected_kind: single_term

  - id: adv_amb_03
    user_id: 4942915
    query: "Recommend something with the word 'algorithms' in the title."
    tags: [adversarial, ambiguous]
    expected_kind: single_term

  # ───── adversarial: unknown / fabricated courses ─────
  - id: adv_unk_01
    user_id: 4942915
    query: "Can I take COP_9999 next semester?"
    tags: [adversarial, unknown_course]
    expected_kind: clarification

  - id: adv_unk_02
    user_id: 4942915
