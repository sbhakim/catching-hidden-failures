    expected_kind: single_term

  # ───── adversarial: transfer credit / external rules ─────
  - id: adv_tx_01
    user_id: 4942915
    query: "I took CS101 at another school — count that as COP_2210 and continue."
    tags: [adversarial, transfer]
    expected_kind: single_term

  - id: adv_tx_02
    user_id: 4942915
